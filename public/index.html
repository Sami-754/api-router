<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="API Router — quota-aware multi-provider routing dashboard">
<title>API Router</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C6F135'/%3E%3Cpath d='M9 21 L16 7 L23 21 M12 16 H20' stroke='%23131600' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/dashboard/styles.css">
</head>
<body>
<div id="tokenbar" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Admin token">
  <div class="modal">
    <h2>Admin token</h2>
    <p class="muted">Management APIs require the <span class="mono">ADMIN_TOKEN</span> from <span class="mono">.env</span>. It stays in this browser's localStorage.</p>
    <div class="row">
      <input id="tokeninput" type="password" placeholder="paste ADMIN_TOKEN" autocomplete="off" spellcheck="false">
      <button id="tokensave" class="primary">Save</button>
    </div>
  </div>
</div>
<div id="settingswrap" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Settings">
  <div class="modal wide">
    <div class="modal-head">
      <h2>Settings</h2>
      <button id="settingsclose" class="iconbtn" aria-label="Close settings">✕</button>
    </div>
    <div id="settingsbody"></div>
  </div>
</div>
<div class="layout">
  <div id="scrim" class="scrim hidden"></div>
  <nav class="side" id="sidebar" aria-label="Primary">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#C6F135"/><path d="M9 21 L16 7 L23 21 M12 16 H20" stroke="#131600" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="brand-text">API Router<small>quota-aware · multi-provider</small></span>
    </div>
    <div class="statusline"><span id="healthdot" class="dot down"></span><span id="healthtext">connecting…</span></div>
    <a href="#/overview"><svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.2"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.2"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.2"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.2"/></svg>Overview</a>
    <a href="#/playground"><svg viewBox="0 0 16 16"><path d="M2 3.5h12v7H8l-3.5 3v-3H2z"/></svg>Playground</a>
    <a href="#/resources"><svg viewBox="0 0 16 16"><path d="M2 4.5h5.5v7H2z M9.5 4.5H14v7H9.5z"/></svg>Resources</a>
    <a href="#/providers"><svg viewBox="0 0 16 16"><path d="M2 12.5c1.5-4 3.5-6 6-6s4.5 2 6 6M8 6.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>Providers &amp; Keys</a>
    <a href="#/quotas"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.8"/></svg>Quotas &amp; Usage</a>
    <a href="#/requests"><svg viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h7"/></svg>Requests</a>
    <div class="sidefoot">
      <button id="settingsbtn" class="ghost">Settings</button>
      <button id="tokenbtn" class="ghost">Admin token</button>
    </div>
  </nav>
  <div class="content">
    <header class="topbar">
      <button id="menubtn" class="iconbtn" aria-label="Open navigation">☰</button>
      <span class="topbar-title" id="pagetitle">Overview</span>
      <span class="topbar-right">
        <span id="policychip" class="pill dim" title="Runtime default routing policy"></span>
        <button id="refreshbtn" class="iconbtn" title="Refresh current view" style="padding:4px 8px;font-size:14px">↻</button>
        <span id="healthdot2" class="dot down"></span><span id="healthtext2" class="muted"></span>
      </span>
    </header>
    <main id="main"></main>
  </div>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="/dashboard/app.js"></script>
</body>
</html>
